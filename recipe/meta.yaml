{% set name = "bigbrother" %}
{% set version = "0.1.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fcde068a71605e209197405759086e496357f6203a49f3dbebaa64dd4ec26151

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - pydantic

test:
  requires:
    - python {{ python_min }}
  imports:
    - bigbrother

about:
  home: http://github.com/timkpaine/bigbrother
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: A library for object observability
  description: A library for object observability
  dev_url: https://github.com/timkpaine/bigbrother

extra:
  recipe-maintainers:
    - timkpaine
